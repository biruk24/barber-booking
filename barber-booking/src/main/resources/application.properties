spring.application.name=barber-booking

# Server
server.port=${PORT:9090}

# Database
# Database - TiDB Cloud
spring.datasource.url=${DB_URL:jdbc:mysql://gateway01.eu-central-1.prod.aws.tidbcloud.com:4000/barber_shop?sslMode=VERIFY_IDENTITY}
spring.datasource.username=${DB_USERNAME:29yZKVCSTgRuR56.root}
